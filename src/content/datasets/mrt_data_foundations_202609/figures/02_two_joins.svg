<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="355" viewBox="0 0 1010 355" role="img" aria-label="The same station lookup is joined twice to attach origin and destination names"><style>text{font-family:Arial,sans-serif;fill:#342a20}.small{font-size:14px}.body{font-size:17px}.heading{font-size:20px;font-weight:bold}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a5b20"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="25" width="310" height="165" rx="12" fill="#fffaf1" stroke="#d6c4a9"/><rect x="380" y="25" width="250" height="165" rx="12" fill="#fffaf1" stroke="#d6c4a9"/><rect x="680" y="25" width="310" height="165" rx="12" fill="#fffaf1" stroke="#d6c4a9"/><text x="40" y="58" class="heading" >LOOK UP THE ORIGIN</text><text x="40" y="96" class="body" >NS17/CC15 → Bishan</text><text x="40" y="128" class="small" >many records : one station</text><text x="400" y="58" class="heading" >ONE OD RECORD</text><text x="400" y="96" class="body" >NS17/CC15 → CC16</text><text x="400" y="128" class="body" >TOTAL_TRIPS = 256</text><text x="700" y="58" class="heading" >LOOK UP THE DESTINATION</text><text x="700" y="96" class="body" >CC16 → Marymount</text><text x="700" y="128" class="small" >many records : one station</text><line x1="330" y1="107" x2="376" y2="107" stroke="#9a5b20" stroke-width="2" marker-end="url(#arrow)"/><line x1="680" y1="107" x2="634" y2="107" stroke="#9a5b20" stroke-width="2" marker-end="url(#arrow)"/><rect x="170" y="240" width="670" height="90" rx="12" fill="#fffaf1" stroke="#d6c4a9"/><text x="195" y="274" class="heading" >Bishan → Marymount | 256 trips</text><text x="195" y="305" class="small" >The names are added; the observation and its trip count stay unchanged.</text><line x1="505" y1="193" x2="505" y2="234" stroke="#9a5b20" stroke-width="2" marker-end="url(#arrow)"/></svg>