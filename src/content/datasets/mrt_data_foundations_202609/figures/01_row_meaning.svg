<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Three tables with different row meanings: stations, OD observations and exits"><style>text{font-family:Arial,sans-serif;fill:#342a20}.small{font-size:14px}.body{font-size:17px}.heading{font-size:20px;font-weight:bold}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a5b20"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="30" width="290" height="200" rx="12" fill="#fffaf1" stroke="#d6c4a9"/><rect x="355" y="30" width="290" height="200" rx="12" fill="#fffaf1" stroke="#d6c4a9"/><rect x="690" y="30" width="290" height="200" rx="12" fill="#fffaf1" stroke="#d6c4a9"/><text x="40" y="65" class="heading" >STATION LOOKUP</text><text x="40" y="100" class="body" >One row per station complex</text><text x="40" y="130" class="body" >NS17/CC15 → Bishan</text><text x="40" y="160" class="body" >CC16 → Marymount</text><text x="40" y="190" class="body" >4 unique station keys</text><text x="375" y="65" class="heading" >OD OBSERVATIONS</text><text x="375" y="100" class="body" >One row per directed pair,</text><text x="375" y="130" class="body" >month, day type and hour</text><text x="375" y="160" class="body" >Bishan → Marymount: 256</text><text x="375" y="190" class="body" >12 rows in the selected slice</text><text x="710" y="65" class="heading" >EXIT LOCATIONS</text><text x="710" y="100" class="body" >One row per station exit</text><text x="710" y="130" class="body" >Bishan: 5 exit records</text><text x="710" y="160" class="body" >Marymount: 2 exit records</text><text x="710" y="190" class="body" >19 exit records for 4 stations</text><text x="20" y="270" class="body" >Repeated station codes in observations or exits are expected. The row meaning determines the key.</text></svg>