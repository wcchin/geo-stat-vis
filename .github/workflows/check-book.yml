name: Check book and self-study notebooks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BASE_URL: /${{ github.event.repository.name }}
      MPLBACKEND: Agg
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install book builder
        run: npm install -g jupyter-book@2.1.7
      - name: Install pilot notebook dependencies
        run: python -m pip install numpy 'scipy>=1.16' matplotlib pandas ipython nbformat pyproj shapely scikit-learn geopandas pyogrio
      - name: Validate HDB and URA teaching inputs
        run: python scripts/check_hdb_ura_inputs.py
      - name: Execute completed statistical-foundations notebooks
        run: python scripts/check_foundations_notebooks.py
      - name: Execute point-pattern and clustering solutions
        run: python scripts/check_point_pattern_guided_notebooks.py
      - name: Check guided global and local Moran solutions
        run: python scripts/check_areal_guided.py
      - name: Check portable OD-flow worked example
        run: python scripts/check_od_worked_notebook.py
      - name: Check Part 1 to Part 3 activity links
        run: python scripts/check_chapter_notebook_links.py
      - name: Check notebook calculations
        run: python scripts/check_nna_pilot.py
      - name: Check original spatial illustrations
        run: python scripts/draw_spatial_figures.py
      - name: Check autocorrelation self-study notebook offline
        run: python scripts/check_autocorrelation_pilot.py
      - name: Check Moran worked example
        run: python scripts/draw_morans_figures.py
      - name: Check point-pattern examples
        run: python scripts/point_pattern_examples.py
      - name: Check Malaysian income areal analysis
        run: python scripts/malaysia_income_analysis.py --check
      - name: Reproduce MRT joins and spatial matches
        working-directory: src/content/datasets/mrt_data_foundations_202609
        run: python reproduce.py
      - name: Reproduce bus comparison demonstrations
        working-directory: src/content/datasets/bus_ridership_202609
        run: python bus_analysis.py
      - name: Reproduce HDB clustering and dual KDE
        working-directory: src/content/datasets/hdb_resale_2026
        run: |
          python analysis.py
          python dual_kde.py
      - name: Reproduce neighbourhood story measures
        working-directory: src/content/datasets/neighbourhood_story_2026
        run: python analyse.py
      - name: Build book without deploying
        run: jupyter-book build --html



